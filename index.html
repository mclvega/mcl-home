<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<title>McL Juegos</title>
<style>
  :root {
    --bg: #000;
    --card: #0b0b0d;
    --border: #1c1c22;
    --text: #f2f2f5;
    --muted: #8a8a96;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: max(24px, env(safe-area-inset-top)) 16px 32px;
  }
  header { max-width: 960px; margin: 0 auto 28px; }
  h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; }
  h1 span { color: var(--muted); font-weight: 400; }
  header p { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  main {
    max-width: 960px; margin: 0 auto;
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  a.card {
    display: flex; flex-direction: column; gap: 14px;
    padding: 20px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--border);
    color: inherit; text-decoration: none;
    transition: transform .15s, border-color .15s;
  }
  a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  a.card:active { transform: scale(.98); }
  .icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: grid; place-items: center; font-size: 1.5rem;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .card h2 { font-size: 1.05rem; font-weight: 600; }
  .card p { color: var(--muted); font-size: .85rem; line-height: 1.4; }
  .go { margin-top: auto; font-size: .8rem; color: var(--accent); font-weight: 600; }
  footer { max-width: 960px; margin: 32px auto 0; color: #44444c; font-size: .75rem; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>McL <span>Juegos</span></h1>
  <p>Elige un juego para empezar</p>
</header>

<main id="games"></main>

<footer>McL · Netlify</footer>

<script>
  const games = [
    { name: "Last Survival", url: "https://mcl-last-survival.netlify.app", icon: "🔥", accent: "#ff8a1f", desc: "Sobrevive el mayor tiempo posible." },
    { name: "Biblia Quiz",   url: "https://mcl-biblia-quiz.netlify.app",   icon: "📖", accent: "#c0394b", desc: "Pon a prueba tus conocimientos bíblicos." },
    { name: "Arcade",        url: "https://mcl-arcade.netlify.app",        icon: "🕹️", accent: "#4caf50", desc: "Colección de minijuegos clásicos." },
    { name: "Tiles",         url: "https://mcl-tiles.netlify.app",         icon: "🧩", accent: "#f0b45a", desc: "Juega con fichas, quédate tranquilo." },
    { name: "Archer",        url: "https://mcl-archer.netlify.app",        icon: "🏹", accent: "#ffcf4a", desc: "Esquiva, quédate quieto y dispara. Salas sin fin." },
    { name: "Slug",          url: "https://mcl-slug.netlify.app",          icon: "🪖", accent: "#ff7a1a", desc: "Acción 2D: rescata rehenes y vence jefes." },
  ];

  document.getElementById("games").innerHTML = games.map(g => `
    <a class="card" href="${g.url}" style="--accent:${g.accent}">
      <div class="icon">${g.icon}</div>
      <div>
        <h2>${g.name}</h2>
        <p>${g.desc}</p>
      </div>
      <span class="go">Jugar →</span>
    </a>`).join("");
</script>
</body>
</html>
