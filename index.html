<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>McL Juegos</title>
<style>
  :root {
    --bg: #000;
    --card: #000;
    --border: #222;
    --text: #f2f2f5;
    --muted: #8a8a96;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: max(24px, env(safe-area-inset-top)) 16px 32px;
  }
  header { max-width: 960px; margin: 0 auto 28px; }
  h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; }
  h1 span { color: var(--muted); font-weight: 400; }
  header p { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  main {
    max-width: 960px; margin: 0 auto;
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  a.card {
    position: relative;
    display: flex; flex-direction: column; gap: 14px;
    padding: 20px; border-radius: 18px;
    background: var(--card); border: 1px solid var(--border);
    color: inherit; text-decoration: none;
    transition: transform .15s, border-color .15s;
  }
  a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  a.card:active { transform: scale(.98); }
  .icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: grid; place-items: center; font-size: 1.5rem;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .card h2 { font-size: 1.05rem; font-weight: 600; }
  .card p { color: var(--muted); font-size: .85rem; line-height: 1.4; }
  .go { margin-top: auto; font-size: .8rem; color: var(--accent); font-weight: 600; }
  .corta { display: none; }
  .nuevo {
    position: absolute; top: 12px; right: 12px;
    padding: 2px 8px; border-radius: 999px;
    font-size: .7rem; font-weight: 700; letter-spacing: .02em;
    color: #000; background: var(--accent);
  }
  /* Móvil: dos columnas, solo el ícono y una descripción corta; toda la tarjeta lleva al juego. */
  @media (max-width: 600px) {
    main { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    a.card { align-items: center; text-align: center; gap: 10px; padding: 18px 10px; }
    .icon { width: 64px; height: 64px; border-radius: 18px; font-size: 2rem; }
    .card .info, .go { display: none; }
    .corta { display: block; color: var(--text); font-size: .85rem; font-weight: 600; line-height: 1.3; }
    .nuevo { top: 8px; right: 8px; }
  }
  footer { max-width: 960px; margin: 32px auto 0; color: #44444c; font-size: .75rem; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>McL <span>Juegos</span></h1>
  <p>Elige un juego para empezar</p>
</header>

<main id="games"></main>

<footer>McL · Netlify</footer>

<script>
  // `fecha`: cuándo se publicó cada juego. La portada los ordena de más nuevo a más antiguo.
  const games = [
    { fecha: "2026-10-13", name: "Biblia Quiz",   url: "https://mcl-biblia-quiz.netlify.app",   icon: "📖", accent: "#c0394b", desc: "Pon a prueba tus conocimientos bíblicos.", corta: "Preguntas bíblicas" },
    { fecha: "2026-10-13", name: "Arcade",        url: "https://mcl-arcade.netlify.app",        icon: "🕹️", accent: "#4caf50", desc: "Colección de minijuegos clásicos.", corta: "Tus propias tiendas" },
    { fecha: "2026-10-13", name: "Tiles",         url: "https://mcl-tiles.netlify.app",         icon: "🧩", accent: "#f0b45a", desc: "Juega con fichas, quédate tranquilo.", corta: "Junta tres fichas" },
    { fecha: "2026-10-14", name: "Last Survival", url: "https://mcl-last-survival.netlify.app", icon: "🔥", accent: "#ff8a1f", desc: "Sobrevive el mayor tiempo posible.", corta: "Sobrevive a los zombis" },
    { fecha: "2026-10-14", name: "Archer",        url: "https://mcl-archer.netlify.app",        icon: "🏹", accent: "#ffcf4a", desc: "Esquiva, quédate quieto y dispara. Salas sin fin.", corta: "Arquero sin fin" },
    { fecha: "2026-10-14", name: "Slug",          url: "https://mcl-slug.netlify.app",          icon: "🪖", accent: "#ff7a1a", desc: "Acción lateral en 3D: rescata rehenes y vence jefes.", corta: "Acción y rehenes" },
    { fecha: "2026-10-14", name: "Snow",          url: "https://mcl-snow.netlify.app",          icon: "❄️", accent: "#7fd0ff", desc: "Shooter por equipos en la nieve, como fy_snow.", corta: "Shooter en la nieve" },
    { fecha: "2026-10-15", name: "Stick War",     url: "https://mcl-stickwar.netlify.app",      icon: "⚔️", accent: "#ffd27a", desc: "Mina oro, entrena tu ejército y derriba la estatua enemiga.", corta: "Derriba la estatua" },
    { fecha: "2026-10-18", name: "Royale",        url: "https://mcl-royale.netlify.app",        icon: "🪂", accent: "#ffc83d", desc: "Battle royale sin construcción: 10 jugadores, una isla y la tormenta.", corta: "Último en pie" },
    { fecha: "2026-10-18", name: "Valhalla",      url: "https://mcl-valhalla.netlify.app",      icon: "🪓", accent: "#9fe8ff", desc: "Roguelike nórdico sin fin: bloquea, esquiva y remata en cada reino.", corta: "Reinos sin fin" },
    { fecha: "2026-10-22", name: "City",          url: "https://mcl-city.netlify.app",          icon: "🌆", accent: "#ff8a3d", desc: "Mundo abierto sin misiones: roba coches, gana respeto y escapa de la policía.", corta: "Ciudad sin fin" },
    { fecha: "2026-11-01", name: "Evolution",     url: "https://mcl-evolution.netlify.app",     icon: "🧬", accent: "#7aff5a", desc: "De gusano a dragón: come, caza, vence al Alfa y elige mutaciones.", corta: "Evoluciona sin fin" },
    { fecha: "2026-11-02", name: "Darklight",     url: "https://mcl-darklight.netlify.app",     icon: "🏮", accent: "#ffb347", desc: "Enciende y aviva luces para que los monstruos de la oscuridad no te alcancen.", corta: "Sobrevive a la noche" },
    { fecha: "2026-11-02", name: "Refugio",       url: "https://mcl-refugio.netlify.app",       icon: "🏕️", accent: "#8bc34a", desc: "Recolecta, construye tu base y aguanta las oleadas de cada noche en el bosque.", corta: "Sobrevive días" },
  ];

  // Más nuevos primero; con la misma fecha, el último añadido va antes.
  const ordenados = games.map((g, i) => ({ ...g, i })).sort((a, b) => b.fecha.localeCompare(a.fecha) || b.i - a.i);
  // Insignia «Nuevo» durante los 7 días siguientes a su publicación.
  const esNuevo = (fecha) => Date.now() - new Date(`${fecha}T00:00:00`).getTime() < 7 * 24 * 3600 * 1000;

  document.getElementById("games").innerHTML = ordenados.map(g => `
    <a class="card" href="${g.url}" style="--accent:${g.accent}" aria-label="${g.name}: ${g.desc}">
      ${esNuevo(g.fecha) ? '<span class="nuevo">Nuevo</span>' : ''}
      <div class="icon">${g.icon}</div>
      <span class="corta">${g.corta}</span>
      <div class="info">
        <h2>${g.name}</h2>
        <p>${g.desc}</p>
      </div>
      <span class="go">Jugar →</span>
    </a>`).join("");
</script>
<script>
  // Guarda la portada para abrirla sin conexión (también instalada como app).
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => undefined));
</script>
</body>
</html>
